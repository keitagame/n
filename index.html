<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>ℕ</title>

<!-- Font Awesome CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
* {
  
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background-color: #fff;
  color: #0f1419;
}

/* 全体レイアウトのコンテナ */
.layout-container {
  display: flex;
  justify-content: center;
  max-width: 1280px;
  margin: 0 auto;
  min-height: 100vh;
}

/* -----------------------------------
   左サイドバー
----------------------------------- */
.sidebar {
  width: 260px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-right: 1px solid #e5e7eb;
  position: sticky;
  top: 0;
  height: 100vh;
}

.sidebar-top {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

/* ロゴアイコン */
.logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  font-size: 26px;
  color: #ffffff;
  text-decoration: none;
  margin-bottom: 4px;
  transition: background-color 0.2s;
}

.logo:hover {
  background-color: rgba(29, 155, 240, 0.1);
}

/* ナビゲーションメニュー */
.nav-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 12px 16px;
  font-size: 18px;
  color: #0f1419;
  text-decoration: none;
  border-radius: 9999px;
  transition: background-color 0.2s;
}

.nav-item:hover {
  background-color: rgba(15, 20, 25, 0.1);
}

.nav-item.active {
  font-weight: 700;
}

.nav-item i {
  font-size: 20px;
  width: 24px;
  text-align: center;
}

/* 投稿ボタン */
.post-btn {
  margin-top: 16px;
  background-color: #1d9bf0;
  color: #fff;
  border: none;
  border-radius: 9999px;
  padding: 14px 0;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  width: 100%;
  transition: background-color 0.2s;
}

.post-btn:hover {
  background-color: #1a8cd8;
}

/* 下部ユーザープロフィールミニ表示 */
.user-profile {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-radius: 9999px;
  cursor: pointer;
  transition: background-color 0.2s;
}

.user-profile:hover {
  background-color: rgba(15, 20, 25, 0.1);
}

.user-profile-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.user-profile-left img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
}

.user-profile-info {
  display: flex;
  flex-direction: column;
  font-size: 14px;
}

.user-profile-info .name {
  font-weight: 700;
}

.user-profile-info .username {
  color: #536471;
}

/* -----------------------------------
   メインコンテンツエリア（ポスト表示）
----------------------------------- */
.main-content {
  flex: 1;
  max-width: 600px;
  padding: 0px;
}

.post {
  display: flex;
  gap: 12px;
  padding: 16px;
  border-bottom: 1px solid #e5e7eb;
  
  border-radius: 0px;
  background: #fff;
}

.avatar,
.avatar img {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.avatar img {
  border: 1px solid rgb(227, 227, 227);
}

.content {
  flex: 1;
}

.header {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-bottom: 1px;
}

.header .name {
  font-weight: 700;
}

.header .username,
.header .time {
  color: #666;
  font-size: 14px;
}

.text {
  margin: 0 0 12px;
  line-height: 1.5;
}

.post-image {
  width: 100%;
  border-radius: 0px;
  display: block;
}

.actions {
  display: flex;
  justify-content: space-between;
  margin-top: 12px;
}

.actions button {
  background: none;
  border: none;
  color: #666;
  cursor: pointer;
  font-size: 14px;
  padding: 6px 8px;
  border-radius: 9999px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background-color 0.2s, color 0.2s;
}

.actions button:hover { background-color: rgba(0, 0, 0, 0.05); }
.actions button.reply:hover { color: #1d9bf0; }
.actions button.repost:hover { color: #00ba7c; }
.actions button.like:hover { color: #f91880; }
.actions button.share:hover { color: #1d9bf0; }

.actions i {
  font-size: 16px;
}

/* -----------------------------------
   右サイドバー（検索・トレンド・ニュース）
----------------------------------- */
.right-sidebar {
  border-left: 1px solid #e5e7eb;
  width: 350px;
  padding: 12px 0 12px 24px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 16px;
  scrollbar-width: none;
}

.right-sidebar::-webkit-scrollbar { display: none; }

.search-box {
  position: sticky;
  top: 0;
  z-index: 2;
  background: #fff;
  padding-bottom: 4px;
}
.search-field {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #eff3f4;
  border: 1px solid transparent;
  border-radius: 9999px;
  padding: 0 16px;
  height: 44px;
  color: #536471;
  transition: background-color 0.2s, border-color 0.2s;
}
.search-field:focus-within {
  background: #fff;
  border-color: #1d9bf0;
  color: #1d9bf0;
}
.search-field input {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  font-size: 15px;
  color: #0f1419;
}

.card {
  background: #f7f9f9;
  border-radius: 16px;
  overflow: hidden;
}
.card-title {
  margin: 0;
  padding: 12px 16px;
  font-size: 20px;
  font-weight: 800;
}
.card-item {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 12px 16px;
  text-decoration: none;
  color: inherit;
  transition: background-color 0.2s;
}
.card-item:hover { background: rgba(0, 0, 0, 0.03); }
.card-item .meta { font-size: 13px; color: #536471; }
.card-item .topic { font-weight: 700; font-size: 15px; margin: 2px 0; }
.card-item .count { font-size: 13px; color: #536471; }
.card-item .more { color: #536471; align-self: flex-start; }
.news-item .news-body { flex: 1; min-width: 0; }
.news-item .news-thumb {
  width: 72px;
  height: 72px;
  border-radius: 12px;
  background: #cfd9de;
  flex-shrink: 0;
  object-fit: cover;
}
.card-more {
  display: block;
  padding: 16px;
  color: #1d9bf0;
  font-size: 15px;
  text-decoration: none;
  transition: background-color 0.2s;
}
.card-more:hover { background: rgba(0, 0, 0, 0.03); }

.footer-links {
  padding: 0 16px;
  font-size: 13px;
  color: #536471;
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
}
.footer-links a { color: inherit; text-decoration: none; }
.footer-links a:hover { text-decoration: underline; }

/* 幅が足りないときは右サイドバーを隠す */
@media (max-width: 1100px) {
  .layout-container { max-width: 920px; }
  .right-sidebar { display: none; }
}

/* -----------------------------------
   レスポンシブ対応
----------------------------------- */
html { -webkit-text-size-adjust: 100%; }
body { overflow-x: hidden; }
.layout-container { width: 100%; }
.sidebar, .right-sidebar { flex-shrink: 0; }
.main-content { min-width: 0; width: 100%; }
.content { min-width: 0; }
.avatar { flex-shrink: 0; }
.text { overflow-wrap: anywhere; white-space: pre-wrap; }
.prof .bio, .row .bio, .bubble, .notif .excerpt { white-space: pre-wrap; }
.post-image { max-width: 100%; height: auto; }
.header { flex-wrap: wrap; min-width: 0; }
.header .username { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.news-item .topic { overflow-wrap: anywhere; }

/* 中間幅: 右サイドバーを細くする */
@media (max-width: 1280px) {
  .right-sidebar { width: 300px; padding-left: 16px; }
}

/* タブレット: 左サイドバーをアイコンのみに */
@media (max-width: 900px) {
  .layout-container { max-width: 100%; }
  .sidebar { width: 72px; padding: 8px; align-items: center; }
  .sidebar-top { align-items: center; width: 100%; }
  .nav-item { padding: 12px; justify-content: center; }
  .nav-item span { display: none; }
  .post-btn {
    width: 50px; height: 50px; padding: 0; font-size: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .post-btn::before {
    font-family: "Font Awesome 6 Free"; font-weight: 900;
    content: "\f304"; font-size: 18px;
  }
  .user-profile { padding: 6px; justify-content: center; }
  .user-profile-info, .user-profile > i { display: none; }
  .main-content { max-width: none; }
}

/* スマホ: 左サイドバーを下部ナビゲーションに */
@media (max-width: 600px) {
  .layout-container { display: block; }
  .sidebar {
    position: fixed; left: 0; right: 0; bottom: 0; top: auto;
    width: 100%; height: auto; z-index: 10;
    flex-direction: row; justify-content: center;
    padding: 4px 8px calc(4px + env(safe-area-inset-bottom, 0px));
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(8px);
    border-right: none; border-top: 1px solid #e5e7eb;
  }
  .sidebar-top { flex-direction: row; justify-content: space-around; gap: 0; }
  .logo, .user-profile { display: none; }
  /* ポストボタン: 下部ナビの右上に浮かせて表示(sidebarを基準に配置) */
  .post-btn {
    display: flex; position: absolute; right: 16px; bottom: calc(100% + 16px);
    width: 56px; height: 56px; margin: 0; z-index: 11;
    box-shadow: 0 4px 14px rgba(29, 155, 240, 0.45);
  }
  .post-btn::before { font-size: 22px; color: #fff; }
  body[data-route="messages"] .post-btn { display: none; }
  .nav-item { padding: 10px; }
  .nav-item i { font-size: 22px; }
  .main-content { max-width: 100%; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .post { padding: 12px; gap: 10px; }
  .post-image { max-width: 100%; }
}

/* ===================================
   追加ページ用スタイル
=================================== */
.main-content a { color: inherit; text-decoration: none; }
.view-header {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 20px;
  padding: 10px 16px; min-height: 53px;
  background: rgba(255,255,255,0.88); backdrop-filter: blur(10px);
  border-right: 1px solid #e5e7eb;
}
.view-header h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2; }
.view-header .sub { font-size: 13px; color: #536471; }
.view-header .back {
  width: 34px; height: 34px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
}
.view-header .back:hover { background: rgba(15,20,25,0.1); }
.view-header .search-field { flex: 1; }

.tabs { display: flex; border-bottom: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb; background: #fff; }
.tabs button {
  flex: 1; background: none; border: none; cursor: pointer;
  padding: 14px 8px; font-size: 15px; color: #536471; position: relative;
  transition: background-color 0.2s;
}
.tabs button:hover { background: rgba(15,20,25,0.05); }
.tabs button.active { color: #0f1419; font-weight: 700; }
.tabs button.active::after {
  content: ""; position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
  width: 56px; height: 4px; border-radius: 9999px; background: #1d9bf0;
}

.post a.name:hover { text-decoration: underline; }
.avatar .ph {
  width: 100%; height: 100%; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700;
}
.avatar.lg, .avatar.lg img { width: 48px; height: 48px; }
.actions button.on.repost { color: #00ba7c; }
.actions button.on.like { color: #f91880; }
.actions button.on.bookmark { color: #1d9bf0; }
.actions button.bookmark:hover { color: #1d9bf0; }

.btn {
  border-radius: 9999px; padding: 7px 16px; font-size: 14px; font-weight: 700;
  cursor: pointer; border: 1px solid #cfd9de; background: #fff; color: #0f1419;
  transition: background-color 0.2s;
}
.btn:hover { background: #f7f9f9; }
.btn.dark { background: #0f1419; border-color: #0f1419; color: #fff; }
.btn.dark:hover { background: #272c30; }
.btn.blue { background: #1d9bf0; border-color: #1d9bf0; color: #fff; }
.btn.blue:hover { background: #1a8cd8; }

.empty {
  text-align: center; padding: 56px 24px; color: #536471;
  border-right: 1px solid #e5e7eb; border-top: 1px solid #e5e7eb;
}
.empty i { font-size: 40px; color: #cfd9de; margin-bottom: 12px; }
.empty h2 { margin: 0 0 6px; color: #0f1419; font-size: 24px; }
.empty p { margin: 0; }

.section-title { margin: 0; padding: 14px 16px 8px; font-size: 20px; font-weight: 800;
  border-top: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  border-top: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb;
  background: #fff; transition: background-color 0.2s; min-width: 0;
}
a.row:hover, .row.click:hover { background: #f7f9f9; }
.row .grow { flex: 1; min-width: 0; }
.row .nm { font-weight: 700; }
.row .hd { color: #536471; font-size: 14px; }
.row .bio { font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
.row .trend-meta { font-size: 13px; color: #536471; }
.row .trend-topic { font-weight: 700; }

/* 通知 */
.notif { align-items: flex-start; }
.notif.unread { background: #f3f9fe; }
.notif .ico { width: 36px; text-align: center; font-size: 24px; flex-shrink: 0; padding-top: 2px; }
.notif .ico.like { color: #f91880; }
.notif .ico.repost { color: #00ba7c; }
.notif .ico.follow { color: #1d9bf0; }
.notif .ico.reply { color: #1d9bf0; }
.notif .who { display: flex; gap: 6px; margin-bottom: 6px; }
.notif .who .avatar { width: 32px; height: 32px; font-size: 14px; }
.notif .excerpt { color: #536471; margin-top: 4px; overflow-wrap: anywhere; }
.notif .when { color: #536471; font-size: 13px; }

/* DM */
.convo { cursor: pointer; }
.convo .last { color: #536471; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.convo .t { color: #536471; font-size: 13px; flex-shrink: 0; align-self: flex-start; }
.chat { display: flex; flex-direction: column; gap: 6px; padding: 16px; min-height: calc(100vh - 53px - 64px);
  border-right: 1px solid #e5e7eb; border-top: 1px solid #e5e7eb; }
.bubble { max-width: 75%; padding: 10px 14px; border-radius: 18px; line-height: 1.45; overflow-wrap: anywhere; }
.bubble.them { align-self: flex-start; background: #eff3f4; border-bottom-left-radius: 4px; }
.bubble.me { align-self: flex-end; background: #1d9bf0; color: #fff; border-bottom-right-radius: 4px; }
.bubble-time { font-size: 12px; color: #536471; margin: 0 4px 6px; }
.bubble-time.me { align-self: flex-end; }
.compose {
  position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center;
  padding: 10px 16px; background: #fff; border-top: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb;
}
.compose input {
  flex: 1; min-width: 0; height: 42px; border-radius: 9999px; border: 1px solid transparent;
  background: #eff3f4; padding: 0 16px; font-size: 15px; outline: none;
}
.compose input:focus { background: #fff; border-color: #1d9bf0; }
.compose button {
  width: 42px; height: 42px; border-radius: 50%; border: none; background: #1d9bf0; color: #fff;
  cursor: pointer; font-size: 16px;
}

/* プロフィール */
.banner { height: 160px; 
    background-image: linear-gradient(135deg, #1d9bf0, #7856ff); 
  
  /* 画像を繰り返さない（1枚だけ表示） */
  background-repeat: no-repeat; 
  
  /* 画像の位置を中央に合わせる */
  background-position: center; 
  
  /* 要素のサイズに合わせて画像を隙間なく引き伸ばす・切り取る */
  background-size: cover; 
    border-right: 1px solid #e5e7eb; }
.prof { padding: 12px 16px 16px; border-right: 1px solid #e5e7eb; }
.prof-top { display: flex; justify-content: space-between; align-items: flex-start; }
.prof .avatar.xl, .prof .avatar.xl img { width: 112px; height: 112px; }
.prof .avatar.xl { margin-top: -68px; border: 4px solid #fff; border-radius: 50%; background: #fff; font-size: 40px; }
.prof h2 { margin: 10px 0 0; font-size: 20px; font-weight: 800; }
.prof .hd { color: #536471; }
.prof .bio { margin: 12px 0; line-height: 1.5; overflow-wrap: anywhere; }
.prof .meta { color: #536471; font-size: 15px; display: flex; gap: 16px; flex-wrap: wrap; }
.prof .meta b { color: #0f1419; }
.edit-form { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px;
  border-right: 1px solid #e5e7eb; border-top: 1px solid #e5e7eb; background: #f7f9f9; }
.edit-form label { font-size: 13px; color: #536471; display: flex; flex-direction: column; gap: 4px; }
.edit-form input, .edit-form textarea {
  font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid #cfd9de;
  border-radius: 8px; outline: none; background: #fff; color: #0f1419; resize: vertical;
}
.edit-form input:focus, .edit-form textarea:focus { border-color: #1d9bf0; }
.edit-form .btns { display: flex; gap: 8px; justify-content: flex-end; }

.toast {
  position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
  background: #1d9bf0; color: #fff; padding: 10px 18px; border-radius: 8px;
  font-size: 15px; z-index: 50; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
}

@media (max-width: 600px) {
  .view-header { padding: 8px 12px; }
  .view-header, .row, .tabs, .prof, .empty, .chat, .compose, .banner, .section-title, .edit-form { border-right: none; }
  .compose { bottom: calc(52px + env(safe-area-inset-bottom, 0px)); }
  .chat { min-height: calc(100vh - 53px - 120px); }
  .toast { bottom: 80px; }
}

/* ===== ℕ 追加 ===== */
.nav-item { position: relative; }
.badge { background: #1d9bf0; color: #fff; border-radius: 9999px; font-size: 12px; padding: 1px 7px; margin-left: -6px; }
.btn-del { margin-left: auto; background: none; border: none; color: #536471; cursor: pointer; padding: 4px 8px; border-radius: 9999px; }
.btn-del:hover { color: #f4212e; background: rgba(244,33,46,.1); }
.header a.time { text-decoration: none; }
.header a.time:hover { text-decoration: underline; }
.text a, .bio a { color: #1d9bf0 !important; }
.text a:hover, .bio a:hover { text-decoration: underline; }
.excerpt { display: block; }
.prof .btns { display: flex; gap: 8px; }
.prof .btns .btn { display: inline-flex; align-items: center; }
body.guest .sidebar, body.guest .right-sidebar { display: none; }
body.guest .layout-container { display: block; }
body.guest .main-content { max-width: 440px; margin: 0 auto; }
.auth { padding: 40px 24px; }
.auth h1 { margin: 0 0 4px; font-size: 28px; color: #1d9bf0; }
.auth h2 { margin: 0 0 16px; font-size: 22px; }
.auth form { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.auth input { font: inherit; padding: 12px 14px; border: 1px solid #cfd9de; border-radius: 8px; outline: none; }
.auth input:focus { border-color: #1d9bf0; }
.auth .btn { padding: 12px 16px; font-size: 16px; }
.auth a { color: #1d9bf0 !important; }
.note { padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
.note.ok { background: #e8f7f0; color: #067a52; }
.note.bad { background: #fdecee; color: #b3141f; }
#dlg { border: none; border-radius: 16px; padding: 0; width: min(560px, calc(100% - 24px)); box-shadow: 0 8px 40px rgba(0,0,0,.25); }
#dlg::backdrop { background: rgba(0,0,0,.4); }
#dlg .dlg-in { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
#dlg h3 { margin: 0; font-size: 18px; }
#dlg textarea { font: inherit; font-size: 17px; min-height: 120px; border: 1px solid #cfd9de; border-radius: 8px; padding: 12px; outline: none; resize: vertical; }
#dlg textarea:focus { border-color: #1d9bf0; }
#dlg .foot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; color: #536471; }

/* ===== アイコン・バナー画像 ===== */
.avatar img, .avatar.lg img, .prof .avatar.xl img { width: 100%; height: 100%; object-fit: cover; }
.prof .avatar.xl img { border: none; }
.img-edit { display: flex; flex-direction: column; gap: 8px; padding-bottom: 6px; border-bottom: 1px solid #e5e7eb; }
.img-ed-row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.img-ed-row .grow { flex: 1; }
.img-edit small { color: #536471; font-size: 12px; }

/* ===================================
   ダークモード（OSの設定に自動で追従）
=================================== */
@media (prefers-color-scheme: dark) {
  :root { color-scheme: dark; }
  body { background-color: #000; color: #e7e9ea; }

  /* 枠線 */
  .right-sidebar, .sidebar, .post, .tabs, .view-header, .banner, .prof, .empty, .section-title, .row,
  .chat, .compose, .edit-form, .tabs { border-color: #2f3336; }
  .img-edit { border-bottom-color: #2f3336; }
  
  /* 左サイドバー */
  .nav-item { color: #e7e9ea; }
  .nav-item:hover, .user-profile:hover, .view-header .back:hover { background-color: rgba(231, 233, 234, 0.1); }
  .user-profile-info .username { color: #71767b; }

  /* ポスト */
  .post { background: #000; }
  .avatar img { border-color: #2f3336; }
  .header .username, .header .time { color: #71767b; }
  .actions button { color: #71767b; }
  .actions button:hover { background-color: rgba(231, 233, 234, 0.1); }

  /* 右サイドバー */
  .search-box { background: #000; }
  .search-field { background: #202327; color: #71767b; }
  .search-field:focus-within { background: #000; color: #1d9bf0; }
  .search-field input, .compose input { color: #e7e9ea; }
  .card { background: #16181c; }
  .card-item:hover, .card-more:hover { background: rgba(255, 255, 255, 0.04); }
  .card-item .meta, .card-item .count, .card-item .more { color: #71767b; }
  .news-item .news-thumb { background: #333639; }
  .footer-links { color: #71767b; }

  /* ヘッダー・タブ */
  .view-header { background: rgba(0, 0, 0, 0.65); }
  .view-header .sub { color: #71767b; }
  .tabs { background: #000; }
  .tabs button { color: #71767b; }
  .tabs button:hover { background: rgba(231, 233, 234, 0.1); }
  .tabs button.active { color: #e7e9ea; }

  /* ボタン */
  .btn { background: transparent; border-color: #536471; color: #e7e9ea; }
  .btn:hover { background: rgba(231, 233, 234, 0.1); }
  .btn.dark { background: #eff3f4; border-color: #eff3f4; color: #0f1419; }
  .btn.dark:hover { background: #d7dbdc; }
  .btn.blue { background: #1d9bf0; border-color: #1d9bf0; color: #fff; }
  .btn.blue:hover { background: #1a8cd8; }
  .btn-del { color: #71767b; }

  /* 一覧・空表示 */
  .empty { color: #71767b; }
  .empty i { color: #333639; }
  .empty h2 { color: #e7e9ea; }
  .row { background: #000; }
  a.row:hover, .row.click:hover { background: #080808; }
  .row .hd, .row .trend-meta, .trend-meta { color: #71767b; }
  .notif.unread { background: #08141d; }
  .notif .excerpt, .notif .when { color: #71767b; }
  .convo .last, .convo .t, .bubble-time { color: #71767b; }

  /* DM */
  .bubble.them { background: #2f3336; color: #e7e9ea; }
  .compose { background: #000; }
  .compose input { background: #202327; }
  .compose input:focus { background: #000; }

  /* プロフィール */
  .prof .avatar.xl { border-color: #000; background: #000; }
  .prof .hd, .prof .meta { color: #71767b; }
  .prof .meta b { color: #e7e9ea; }
  .edit-form { background: #16181c; }
  .edit-form label, .img-edit small { color: #71767b; }
  .edit-form input, .edit-form textarea { background: #000; border-color: #38444d; color: #e7e9ea; }
  .edit-form input:focus, .edit-form textarea:focus { border-color: #1d9bf0; }

  /* 認証画面・通知バナー */
  .auth input { background: #000; border-color: #38444d; color: #e7e9ea; }
  .auth input:focus { border-color: #1d9bf0; }
  .note.ok { background: #0b2a1f; color: #5fd3a0; }
  .note.bad { background: #2f1215; color: #ff8a92; }

  /* ポスト作成ダイアログ */
  #dlg { background: #000; color: #e7e9ea; border: 1px solid #2f3336; }
  #dlg::backdrop { background: rgba(91, 112, 131, 0.4); }
  #dlg textarea { background: #000; border-color: #38444d; color: #e7e9ea; }
  #dlg textarea:focus { border-color: #1d9bf0; }
  #dlg .foot { color: #71767b; }

  .toast { box-shadow: 0 4px 16px rgba(255, 255, 255, 0.12); }
}

/* スマホ下部ナビ（ダーク） */
@media (prefers-color-scheme: dark) and (max-width: 600px) {
  .sidebar { background: rgba(0, 0, 0, 0.92); border-top-color: #2f3336; }
}

/* ===== 返信欄・フォロー一覧 ===== */
.reply-box { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px;
  border-top: 1px solid #e5e7eb; border-right: 1px solid #e5e7eb; }
.reply-box .grow { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.reply-box textarea { font: inherit; font-size: 16px; min-height: 64px; padding: 10px 12px; resize: vertical;
  border: 1px solid #cfd9de; border-radius: 8px; outline: none; background: #fff; color: #0f1419; }
.reply-box textarea:focus { border-color: #1d9bf0; }
.reply-box .foot { display: flex; justify-content: flex-end; align-items: center; gap: 10px; color: #536471; }
.reply-to { display: block; padding: 10px 16px; font-size: 14px; color: #1d9bf0 !important;
  border-right: 1px solid #e5e7eb; }
.reply-to:hover { text-decoration: underline !important; }
.prof .meta-link { color: #536471 !important; }
.prof .meta-link:hover { text-decoration: underline; }
.prof .meta-link b { color: #0f1419; }
.tabs button[data-go] { font: inherit; }
.post[data-id] { cursor: pointer; }
.post[data-id]:hover { background: #f7f9f9; }
@media (prefers-color-scheme: dark) { .post[data-id]:hover { background: #080808; } }

@media (max-width: 600px) {
  .reply-box, .reply-to { border-right: none; }
}
@media (prefers-color-scheme: dark) {
  .reply-box, .reply-to { border-color: #2f3336; }
  .reply-box textarea { background: #000; border-color: #38444d; color: #e7e9ea; }
  .reply-box textarea:focus { border-color: #1d9bf0; }
  .reply-box .foot { color: #71767b; }
  .prof .meta-link { color: #71767b !important; }
  .prof .meta-link b { color: #e7e9ea; }
}

/* ===== リンクプレビュー(OGP) ===== */
.ogp-slot:empty { display: none; }
.ogp { display: block; margin: 0 0 12px; border: 1px solid #cfd9de; border-radius: 16px; overflow: hidden; color: inherit; text-decoration: none; }
.ogp:hover { background: rgba(0, 0, 0, 0.03); }
.ogp img { display: block; width: 100%; height: auto; aspect-ratio: 1.91 / 1; object-fit: cover; border: 0; border-bottom: 1px solid #cfd9de; border-radius: 0; }
.ogp-body { padding: 10px 12px; }
.ogp-site, .ogp-desc { color: #536471; font-size: 13px; }
.ogp-site { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ogp-title { font-size: 15px; font-weight: 700; line-height: 1.35; margin: 2px 0; }
.ogp-title, .ogp-desc { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
@media (prefers-color-scheme: dark) {
  .ogp, .ogp img { border-color: #2f3336; }
  .ogp:hover { background: rgba(231, 233, 234, 0.06); }
  .ogp-site, .ogp-desc { color: #71767b; }
}
</style>
